name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    name: Shell lint and tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install shellcheck shfmt bats-core

      - name: ShellCheck
        run: |
          shellcheck scripts/*.sh src/*.zsh src/*.sh tests/*.bats

      - name: Format check
        run: |
          shfmt -d scripts src tests

      - name: Bats tests
        run: |
          bats tests